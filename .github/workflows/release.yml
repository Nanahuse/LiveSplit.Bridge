name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.14"

      - name: Check release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python eng/check_version.py --release-tag "$env:RELEASE_TAG"

      - name: Check out build dependencies
        shell: pwsh
        run: |
          git submodule update --init --depth 1 external/LiveSplit
          git -C external/LiveSplit submodule update --init --depth 1 lib/SpeedrunComSharp

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET dependencies
        run: dotnet restore src/LiveSplit.Bridge/LiveSplit.Bridge.csproj --nologo

      - name: Build release package
        run: dotnet build src/LiveSplit.Bridge/LiveSplit.Bridge.csproj --configuration Release --no-restore --nologo

      - name: Verify DLL versions and distribution ZIP
        run: uv run --no-project python eng/package_release.py --package-name "LiveSplit.Bridge-$env:RELEASE_TAG"

      - name: Recheck release version before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python eng/check_version.py --release-tag "$env:RELEASE_TAG"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/LiveSplit.Bridge-$env:RELEASE_TAG.zip" `
            artifacts/SHA256SUMS.txt `
            --verify-tag `
            --generate-notes `
            --title "LiveSplit.Bridge $env:RELEASE_TAG"
