name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Test and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out build dependencies
        shell: pwsh
        run: |
          git submodule update --init --depth 1 external/LiveSplit
          git -C external/LiveSplit submodule update --init --depth 1 lib/SpeedrunComSharp

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: tools/livesplit-bridge-cli/uv.lock

      - name: Restore CLI environment
        working-directory: tools/livesplit-bridge-cli
        run: |
          uv sync --locked
          uv run python scripts/generate_proto.py

      - name: Lint CLI
        working-directory: tools/livesplit-bridge-cli
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test .NET projects
        run: dotnet test LiveSplit.Bridge.slnx --configuration Release --nologo

      - name: Test CLI and Bridge integration
        working-directory: tools/livesplit-bridge-cli
        run: uv run pytest

      - name: Build release package
        shell: pwsh
        run: |
          dotnet build src/LiveSplit.Bridge/LiveSplit.Bridge.csproj `
            --configuration Release `
            --no-restore `
            --nologo

          $packageName = "LiveSplit.Bridge-${{ github.ref_name }}"
          $stagingPath = Join-Path $env:RUNNER_TEMP $packageName
          $artifactPath = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $stagingPath, $artifactPath -Force

          Copy-Item `
            -Path "external/LiveSplit/bin/release/Components/*" `
            -Destination $stagingPath `
            -Recurse

          $archivePath = Join-Path $artifactPath "$packageName.zip"
          Compress-Archive -Path "$stagingPath/*" -DestinationPath $archivePath

          $hash = Get-FileHash -Path $archivePath -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $($hash.Path | Split-Path -Leaf)" |
            Set-Content -Path (Join-Path $artifactPath "SHA256SUMS.txt") -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/LiveSplit.Bridge-${{ github.ref_name }}.zip `
            artifacts/SHA256SUMS.txt `
            --verify-tag `
            --generate-notes `
            --title "LiveSplit.Bridge ${{ github.ref_name }}"
