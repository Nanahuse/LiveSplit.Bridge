name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out build dependencies
        shell: pwsh
        run: |
          git submodule update --init --depth 1 external/LiveSplit
          git -C external/LiveSplit submodule update --init --depth 1 lib/SpeedrunComSharp

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore .NET dependencies
        run: dotnet restore src/LiveSplit.Bridge/LiveSplit.Bridge.csproj --nologo

      - name: Build release package
        shell: pwsh
        run: |
          dotnet build src/LiveSplit.Bridge/LiveSplit.Bridge.csproj `
            --configuration Release `
            --no-restore `
            --nologo

          ./eng/package-release.ps1 -PackageName "LiveSplit.Bridge-${{ github.ref_name }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/LiveSplit.Bridge-${{ github.ref_name }}.zip `
            artifacts/SHA256SUMS.txt `
            --verify-tag `
            --generate-notes `
            --title "LiveSplit.Bridge ${{ github.ref_name }}"
