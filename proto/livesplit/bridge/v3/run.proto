syntax = "proto3";

package livesplit.bridge.v3;

option csharp_namespace = "LiveSplit.Bridge.Protocol.V3";

import "livesplit/bridge/v3/common.proto";

message RunState {
  string game_name = 1;
  string category_name = 2;
  sint64 offset_ticks = 3;

  optional string file_path = 4;
  optional string layout_path = 5;

  RunMetadata metadata = 6;

  repeated string comparisons = 7;
  repeated SegmentInfo segments = 8;

  Image game_icon = 9;
}

message SegmentInfo {
  uint32 index = 1;
  string name = 2;

  repeated ComparisonTime comparisons = 3;
  TimeValue best_segment_time = 4;

  Image icon = 5;
}

message ComparisonTime {
  string name = 1;
  TimeValue time = 2;
}

message RunMetadata {
  optional string run_id = 1;

  optional string platform_name = 2;
  optional string region_name = 3;
  bool uses_emulator = 4;

  map<string, string> variables = 5;
}

message Image {
  string mime_type = 1;
  bytes data = 2;
  uint32 width = 3;
  uint32 height = 4;
}
