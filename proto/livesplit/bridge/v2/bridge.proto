syntax = "proto3";

package livesplit.bridge.v2;

option csharp_namespace = "LiveSplit.Bridge.Protocol.V2";

import "livesplit/bridge/v2/common.proto";
import "livesplit/bridge/v2/run.proto";

message Request {
  uint32 protocol_version = 1;
  uint64 request_id = 2;

  oneof body {
    AttachRequest attach = 10;
    GetTimerStateRequest get_timer_state = 11;
    TimerOperationRequest timer_operation = 12;
    GameTimeOperationRequest game_time_operation = 13;
    GetRunRequest get_run = 14;
    GetAttemptRequest get_attempt = 15;
    GetRuntimeStateRequest get_runtime_state = 16;
  }
}

message Response {
  uint32 protocol_version = 1;
  uint64 request_id = 2;

  oneof body {
    BridgeError error = 10;
    AttachResponse attach = 20;
    GetTimerStateResponse get_timer_state = 21;
    OperationResponse operation = 22;
    GetRunResponse get_run = 23;
    GetAttemptResponse get_attempt = 24;
    GetRuntimeStateResponse get_runtime_state = 25;
  }
}

message AttachRequest {}

message AttachResponse {
  uint64 session_id = 1;
  TimerState timer_state = 2;
}

message GetTimerStateRequest {}

message GetTimerStateResponse {
  TimerState timer_state = 1;
}

message GetRunRequest {}

message GetRunResponse {
  RunState run = 1;
}

message GetAttemptRequest {}

message GetAttemptResponse {
  AttemptState attempt = 1;
}

message GetRuntimeStateRequest {}

message GetRuntimeStateResponse {
  RuntimeState runtime_state = 1;
}

message TimerOperationRequest {
  TimerOperationType operation = 1;
}

message GameTimeOperationRequest {
  GameTimeOperationType operation = 1;
  optional sint64 ticks = 2;
}
