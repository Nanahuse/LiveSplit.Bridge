syntax = "proto3";

package livesplit.bridge.v2;

option csharp_namespace = "LiveSplit.Bridge.Protocol.V2";

enum TimerPhase {
  TIMER_PHASE_UNSPECIFIED = 0;
  NOT_RUNNING = 1;
  STARTING = 2;
  RUNNING = 3;
  PAUSED = 4;
  ENDED = 5;
}

enum TimingMethod {
  TIMING_METHOD_UNSPECIFIED = 0;
  REAL_TIME = 1;
  GAME_TIME = 2;
}

enum TimerOperationType {
  TIMER_OPERATION_UNSPECIFIED = 0;
  TIMER_START = 1;
  TIMER_SPLIT = 2;
  TIMER_SKIP = 3;
  TIMER_UNDO = 4;
  TIMER_RESET = 5;
  TIMER_PAUSE = 6;
  TIMER_RESUME = 7;
}

enum GameTimeOperationType {
  GAME_TIME_OPERATION_UNSPECIFIED = 0;
  INITIALIZE = 1;
  SET = 2;
  GAME_TIME_PAUSE = 3;
  GAME_TIME_RESUME = 4;
}

enum BridgeEventType {
  BRIDGE_EVENT_UNSPECIFIED = 0;
  EVENT_TIMER_STARTED = 1;
  EVENT_TIMER_SPLIT = 2;
  EVENT_TIMER_SKIPPED = 3;
  EVENT_TIMER_UNDO = 4;
  EVENT_TIMER_RESET = 5;
  EVENT_TIMER_PAUSED = 6;
  EVENT_TIMER_RESUMED = 7;
  EVENT_GAME_TIME_INITIALIZED = 10;
  EVENT_GAME_TIME_SET = 11;
  EVENT_GAME_TIME_PAUSED = 12;
  EVENT_GAME_TIME_RESUMED = 13;
  EVENT_RUN_CHANGED = 20;
  EVENT_RUNTIME_CHANGED = 21;
  EVENT_HEARTBEAT = 22;
  EVENT_ATTEMPT_CHANGED = 23;
}

message TimeValue {
  optional sint64 real_time_ticks = 1;
  optional sint64 game_time_ticks = 2;
}

message TimerState {
  uint64 session_id = 1;
  uint64 state_revision = 2;

  TimerPhase phase = 3;
  int32 split_index = 4;

  optional sint64 real_time_ticks = 5;
  optional sint64 game_time_ticks = 6;

  bool is_game_time_initialized = 7;
  bool is_game_time_paused = 8;

  uint64 run_revision = 10;
  uint64 attempt_revision = 11;
  uint64 runtime_revision = 12;
}

message AttemptState {
  uint64 session_id = 1;
  uint64 attempt_revision = 2;

  uint32 attempt_count = 10;
  uint32 completed_count = 11;

  repeated AttemptSegment segments = 20;
}

message AttemptSegment {
  uint32 index = 1;
  TimeValue split_time = 2;
  map<string, string> custom_variables = 3;
}

message RuntimeState {
  uint64 session_id = 1;
  uint64 runtime_revision = 2;

  TimingMethod current_timing_method = 10;
  string current_comparison = 11;

  bool global_hotkeys_enabled = 12;

  map<string, string> custom_variables = 20;
}

message OperationResponse {
  bool success = 1;
  string message = 2;
  TimerState timer_state = 3;
}

message BridgeError {
  int32 code = 1;
  string message = 2;
}

message BridgeEvent {
  uint64 session_id = 1;
  uint64 event_sequence = 2;
  BridgeEventType type = 3;
  TimerState timer_state = 4;
}
