[project]
name = "livesplit-bridge-cli"
version = "0.1.0"
description = "Debug CLI for LiveSplit.Bridge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "websocket-client>=1.8,<2",
]

[project.scripts]
livesplit-bridge = "livesplit_bridge_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PYI"]
